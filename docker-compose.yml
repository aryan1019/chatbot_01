services:
  chroma:
    image: chromadb/chroma:latest   # replace "latest" with your pip version, e.g. chromadb/chroma:1.0.15
    container_name: chroma
    ports:
      - "8001:8000"                 # Chroma inside the container uses 8000; we expose it as 8001
    volumes:
      - chroma-data:/data           # keeps your vectors when the container restarts
    restart: unless-stopped

volumes:
  chroma-data: